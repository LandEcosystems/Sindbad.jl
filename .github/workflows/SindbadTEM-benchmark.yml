name: SindbadTEM.jl benchmark
on:
  pull_request:
    paths:
      - 'SindbadTEM/src/Processes/**'
      - 'SindbadTEM/src/Processes.jl'
      - 'SindbadTEM/test/test_data/**'
      - 'tools/benchmark/TestSindbadTEM/**'
      - '.github/workflows/SindbadTEM-benchmark.yml'
    branches:
      - main
  push:
    # No `paths:` filter here (unlike pull_request above): a tag push is a release, and
    # test-model below needs to run for every release regardless of which paths its commit
    # happens to touch -- paths filtering applies to the whole trigger, not per-job, so it can't
    # be scoped to just the test-tem job without also scoping out test-model.
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The comprehensive, detailed check: runs every approach's define/precompute/compute/update
  # multiple times each (for accurate timing/allocation measurement) against the committed
  # TestSindbadTEM-derived test data and reports status/time/allocations. Not a pass/fail gate --
  # approaches outside the test data's own model structure are *expected* to error/not-apply, so
  # this job never fails the build on their account (only a genuine bug in the benchmark/render
  # scripts themselves would). Regenerate the test data via
  # tools/benchmark/TestSindbadTEM/derive_sindbadTEM_test_data.jl if they go stale.
  #
  # A separate workflow file from SindbadTEM.yml (rather than a job in it) so it can be
  # comment-triggered on its own via `/test-models` without also re-running SindbadTEM.yml's
  # full-matrix job -- see ci-commands.yml.
  test-tem:
    name: "SindbadTEM: test-tem (process benchmark)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate SindbadTEM
        shell: julia --project=SindbadTEM {0}
        run: |
          using Pkg
          rm(joinpath("SindbadTEM", "Manifest.toml"); force=true)
          Pkg.instantiate()
      - name: Run benchmark
        run: julia --project=SindbadTEM tools/benchmark/TestSindbadTEM/benchmarkApproaches.jl tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_results.psv
      - name: Render report
        run: |
          julia --project=SindbadTEM tools/benchmark/TestSindbadTEM/renderBenchmarkReport.jl \
            tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_results.psv \
            tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_report.html \
            tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_summary.md
      - name: Add to job summary
        if: always()
        run: cat tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sindbad-process-benchmark
          path: tools/benchmark/TestSindbadTEM/benchmark_output/benchmark_report.html

  # The quick check: runs testApproaches.jl (define/precompute/compute/update type-stability +
  # NaN/Inf checks, one call per approach, informational only -- see
  # SindbadTEM/test/testApproaches.jl and README.md) on demand only: deliberately not part of
  # Pkg.test("SindbadTEM") (see SindbadTEM/test/runtests.jl's comment on why), and not on every
  # PR/push either -- pure Julia logic with no OS-specific behavior, so running it on demand for
  # releases plus `/test-models` is enough; it doesn't need its own 3-OS x 2-Julia-version matrix
  # the way package compilation does.
  test-model:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    name: "SindbadTEM: test-model (approach checks)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate SindbadTEM
        shell: julia --project=SindbadTEM {0}
        run: |
          using Pkg
          rm(joinpath("SindbadTEM", "Manifest.toml"); force=true)
          Pkg.instantiate()
      - name: Run approach checks
        run: julia --project=SindbadTEM SindbadTEM/test/runApproachChecks.jl
