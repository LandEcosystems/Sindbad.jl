name: Sindbad.jl
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
    branches:
      - main
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Runs on every push to a PR -- ubuntu only, both Julia versions. Kept fast/cheap so it's
  # reasonable to require before merge. For full OS coverage, use the "full-matrix" job below
  # (Actions tab -> Run workflow, or comment `/run-full-matrix` on the PR -- see ci-commands.yml).
  quick:
    if: github.event_name == 'pull_request'
    name: "Sindbad: Julia ${{ matrix.version }} - ${{ matrix.os }} - quick"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 1
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Develop and test Sindbad
        shell: julia --project=. {0}
        run: |
          using Pkg
          # CI should not rely on developer-local Manifests that point to /Users/... paths.
          rm("Manifest.toml"; force=true)
          Pkg.instantiate()  # Install all dependencies
          Pkg.test("Sindbad"; coverage=true)
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info

  # Posts an immediate "in progress" comment naming what's running, before full-matrix (which
  # can take a while) finishes -- runs in parallel with it, not blocking its start. The `report`
  # job below overwrites this same comment (same marker) with the final result once it's done.
  start-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Post in-progress status to PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR for branch ${{ github.ref_name }}; skipping comment."
            exit 0
          fi
          {
            echo "<!-- ci-comment-marker: sindbad-full-matrix -->"
            echo "### Sindbad.jl full OS matrix: in progress"
            echo ""
            echo "Running: Julia lts/1 x ubuntu-latest/macOS-latest/windows-latest (6 jobs)"
            echo ""
            echo "[View run]($RUN_URL)"
          } > /tmp/comment_body.md
          .github/scripts/upsert_pr_comment.sh "$pr_number" "sindbad-full-matrix" /tmp/comment_body.md

  # Full OS x Julia-version matrix. Runs automatically after merge to main / on tag push, and
  # on demand (workflow_dispatch) against any branch -- including an open PR's branch, so you
  # can validate the full matrix before merging without paying for it on every commit.
  full-matrix:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: "Sindbad: Julia ${{ matrix.version }} - ${{ matrix.os }} - full"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure }}
    env:
      # Julia 1.10 can deadlock in FileWatching.Pidfile when precompiling
      # multiple package extensions concurrently; force serial precompilation.
      JULIA_NUM_PRECOMPILE_TASKS: 1
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        allow_failure: [false]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Develop and test Sindbad
        shell: julia --project=. {0}
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_VERSION: ${{ matrix.version }}
          TEST_REPORT_CSV: test_report_${{ matrix.os }}_${{ matrix.version }}.csv
        run: |
          using Pkg
          # CI should not rely on developer-local Manifests that point to /Users/... paths.
          rm("Manifest.toml"; force=true)
          Pkg.instantiate()  # Install all dependencies
          # Timed and try/catch'd (rather than a bare Pkg.test call) so the elapsed time and
          # pass/fail status get written to CSV -- and picked up as a build artifact -- even when
          # tests fail; `error(err)` at the end still fails this step/job so CI signal is
          # unchanged.
          ok, err = true, ""
          elapsed = @elapsed try
              Pkg.test("Sindbad"; coverage=true)
          catch e
              ok, err = false, replace(sprint(showerror, e), "\n" => " ", "," => ";")
          end
          open(ENV["TEST_REPORT_CSV"], "w") do io
              println(io, "os,julia,ok,time_s,error")
              println(io, "$(ENV["MATRIX_OS"]),$(ENV["MATRIX_VERSION"]),$(ok),$(round(elapsed, digits=1)),$(err)")
          end
          !ok && error(err)
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sindbad-test-report-${{ matrix.os }}-${{ matrix.version }}
          path: test_report_${{ matrix.os }}_${{ matrix.version }}.csv

  # Posts/updates a sticky comment on the PR whose branch this was dispatched against, so the
  # result of an on-demand full-matrix run shows up in the PR without manual copy/paste.
  # Only meaningful for workflow_dispatch -- push (post-merge/tag) has no PR to comment on.
  report:
    needs: full-matrix
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: sindbad-test-report-*
          path: reports
          merge-multiple: true
      - name: Build timing table
        run: |
          shopt -s nullglob
          csvs=(reports/*.csv)
          {
            if [ ${#csvs[@]} -eq 0 ]; then
              echo "_No timing data available._"
            else
              echo "| OS | Julia | Status | Time (s) |"
              echo "|---|---|---|---|"
              for f in "${csvs[@]}"; do
                tail -n +2 "$f"
              done | while IFS=, read -r os version ok time_s error; do
                status=$( [ "$ok" = "true" ] && echo "OK" || echo "FAILED" )
                printf "| %s | %s | %s | %s |\n" "$os" "$version" "$status" "$time_s"
              done
            fi
          } > /tmp/timing_table.md
      - name: Post result to PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full-matrix.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR for branch ${{ github.ref_name }}; skipping comment."
            exit 0
          fi
          {
            echo "<!-- ci-comment-marker: sindbad-full-matrix -->"
            echo "### Sindbad.jl full OS matrix: $RESULT"
            echo ""
            cat /tmp/timing_table.md
            echo ""
            echo "[View run]($RUN_URL) (Julia lts/1 x ubuntu/macOS/windows)"
          } > /tmp/comment_body.md
          .github/scripts/upsert_pr_comment.sh "$pr_number" "sindbad-full-matrix" /tmp/comment_body.md
