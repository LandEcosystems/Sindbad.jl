name: Test Simulation
on:
  workflow_dispatch:

jobs:
  # Posts an immediate "in progress" comment naming what's running, before simulate (which can
  # take a while) finishes -- runs in parallel with it, not blocking its start. `combine` below
  # overwrites this same comment (same marker) with the final report once it's done.
  start-report:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Post in-progress status to PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR for branch ${{ github.ref_name }}; skipping comment."
            exit 0
          fi
          {
            echo "<!-- ci-comment-marker: test-simulations -->"
            echo "### Test Simulations: in progress"
            echo ""
            echo "Running: LUE/WROASTED x pixel/spatial x forward+optimization x ubuntu/macos/windows (12 jobs)"
            echo ""
            echo "[View run]($RUN_URL)"
          } > /tmp/comment_body.md
          .github/scripts/upsert_pr_comment.sh "$pr_number" "test-simulations" /tmp/comment_body.md

  simulate:
    name: ${{ matrix.setup }} x ${{ matrix.mode }} x F+O x ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        setup: [LUE, WROASTED]
        mode: [pixel, spatial]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-registries: "false"
      - name: Run simulations
        shell: julia --project=examples/scripts {0}
        run: |
          import Pkg
          Pkg.instantiate()
          # `include` resolves relative paths against the calling file's directory, not the
          # process's working directory -- and the calling "file" here is this run block's own
          # generated temp script (under runner.temp), not the checkout. Use $GITHUB_WORKSPACE.
          include(joinpath(ENV["GITHUB_WORKSPACE"], "examples", "scripts", "simulation_report.jl"))
        env:
          SIMULATION_SETUPS: ${{ matrix.setup }}
          SIMULATION_MODES: ${{ matrix.mode }}
          SIMULATION_REPORT_CSV: simulation_report_${{ matrix.os }}_${{ matrix.setup }}_${{ matrix.mode }}.csv
          # spatial runs use 4 threads (GitHub-hosted runners provide 4 cores) -- SINDBAD
          # parallelizes the forward run across sites, and CMA-ES's multi_threading/
          # parallel_evaluation (set in WROASTED's CMAEvolutionStrategy_CMAES.json) parallelizes
          # cost evaluation during optimization. Pixel runs stay single-threaded (one site, no
          # benefit). Julia reads JULIA_NUM_THREADS automatically at startup; `shell:` itself
          # can't use matrix expressions, so this has to be set here instead of via `-t`.
          JULIA_NUM_THREADS: ${{ matrix.mode == 'spatial' && 4 || 1 }}
      - uses: actions/upload-artifact@v7
        with:
          name: simulation-report-${{ matrix.os }}-${{ matrix.setup }}-${{ matrix.mode }}
          path: simulation_report_${{ matrix.os }}_${{ matrix.setup }}_${{ matrix.mode }}.csv

  combine:
    name: Combine reports
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: simulation-report-*
          path: reports
          merge-multiple: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Combine into one report
        shell: julia --project=examples/scripts {0}
        run: |
          import Pkg
          Pkg.instantiate()
          include(joinpath(ENV["GITHUB_WORKSPACE"], "examples", "scripts", "combine_simulation_reports.jl"))
        env:
          SIMULATION_REPORT_DIR: reports
      # Runs even if the step above failed (some/all simulations errored) -- post whatever
      # report was produced to the PR either way, rather than only reporting successes.
      - name: Post result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR for branch ${{ github.ref_name }}; skipping comment."
            exit 0
          fi
          {
            echo "<!-- ci-comment-marker: test-simulations -->"
            echo "[View run]($RUN_URL)"
            echo ""
            cat output_simulation_report_combined.md
          } > /tmp/comment_body.md
          .github/scripts/upsert_pr_comment.sh "$pr_number" "test-simulations" /tmp/comment_body.md
