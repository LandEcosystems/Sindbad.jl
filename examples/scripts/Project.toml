# only honors in its 1.x client; HTTP 2.x silently ignores it and falls back to a native TLS
# stack that fails the handshake against the sindbad S3 bucket. Pin to 1.x until that's fixed
# upstream (tracked: Zarr.jl HTTPStore + HTTP.jl 2.0 client incompatibility).
