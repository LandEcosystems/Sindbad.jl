[deps]
HTTP = "cd3eb016-35fb-5094-929b-558a96fad6f3"
Sindbad = "36c3e672-7dee-4606-99b5-7e5d8d85a313"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[compat]
# Zarr.jl's HTTPStore forces the OpenSSL TLS backend via a `socket_type_tls` kwarg that HTTP.jl
# only honors in its 1.x client; HTTP 2.x silently ignores it and falls back to a native TLS
# stack that fails the handshake against the sindbad S3 bucket. Pin to 1.x until that's fixed
# upstream (tracked: Zarr.jl HTTPStore + HTTP.jl 2.0 client incompatibility). Same fix as
# examples/scripts/Project.toml.
HTTP = "1"

[sources]
Sindbad = {path = "../../.."}
